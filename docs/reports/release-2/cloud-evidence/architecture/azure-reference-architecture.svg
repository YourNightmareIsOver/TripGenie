<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1170" viewBox="0 0 1500 1170" role="img" aria-labelledby="title description">
  <title id="title">TripGenie Azure reference architecture</title>
  <desc id="description">Eighteen Container Apps in Australia East: six public frontends and twelve internal backend and SQLite database services. GitHub authenticates with OIDC; a managed identity pulls commit-tagged images from Azure Container Registry. AI services remain outside the cloud deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 32px; font-weight: 700; }
      .head { font-size: 23px; font-weight: 650; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .box { stroke: #8ca4bc; stroke-width: 1.6; rx: 12; fill: #fff; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .delivery { fill: none; stroke: #334155; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="1170" fill="#fff"/>
  <text x="40" y="48" class="title">Azure reference architecture</text>
  <text x="40" y="80" class="body">TripGenie | Australia East | 18 independently deployed applications</text>

  <rect x="40" y="110" width="330" height="85" class="box" fill="#eef5ff"/>
  <text x="205" y="146" text-anchor="middle" class="head">Browser / traveller</text>
  <text x="205" y="176" text-anchor="middle" class="small">HTTPS / TLS + HTTP redirect</text>

  <rect x="580" y="110" width="360" height="85" class="box"/>
  <text x="760" y="146" text-anchor="middle" class="head">GitHub Actions</text>
  <text x="760" y="176" text-anchor="middle" class="small">OIDC to Azure / builds and pushes images</text>
  <path d="M940 152H1040" class="delivery"/>
  <rect x="1040" y="110" width="420" height="85" class="box"/>
  <text x="1250" y="146" text-anchor="middle" class="head">Azure Container Registry</text>
  <text x="1250" y="176" text-anchor="middle" class="small">Private images tagged with commit SHA</text>

  <rect x="40" y="220" width="1420" height="665" rx="18" fill="#f7fafc" stroke="#7991aa" stroke-width="2"/>
  <text x="60" y="251" class="head">rg-tripgenie / tripgenie-env / Azure Container Apps (Consumption)</text>
  <text x="60" y="283" class="small">18 apps = 6 public frontends + 6 backend APIs + 6 database services.</text>

  <rect x="60" y="315" width="425" height="430" rx="14" fill="#eaf4ff" stroke="#87afd7"/>
  <text x="80" y="350" class="head">Public HTTPS ingress: 6 apps</text>
  <rect x="85" y="378" width="375" height="95" class="box"/>
  <text x="272" y="413" text-anchor="middle" class="head">Shared portal</text>
  <text x="272" y="445" text-anchor="middle" class="body">shared-ui (nginx)</text>
  <path d="M272 473V545" class="flow"/>
  <text x="288" y="510" class="small">Browser navigation links</text>
  <rect x="85" y="545" width="375" height="130" class="box"/>
  <text x="272" y="583" text-anchor="middle" class="head">Feature frontends x 5</text>
  <text x="272" y="617" text-anchor="middle" class="body">student-1 ... student-5</text>
  <text x="272" y="649" text-anchor="middle" class="small">Server-rendered UI; each calls own API</text>
  <text x="80" y="716" class="small">HTTPS URLs + browser security headers</text>

  <rect x="520" y="315" width="915" height="430" rx="14" fill="#edf8f3" stroke="#8ebca8"/>
  <text x="540" y="350" class="head">Internal TCP ingress: 12 apps / no public backend or database URL</text>
  <rect x="550" y="545" width="365" height="130" class="box"/>
  <text x="732" y="583" text-anchor="middle" class="head">Feature backend APIs x 5</text>
  <text x="732" y="617" text-anchor="middle" class="body">Trips / accommodation / transport</text>
  <text x="732" y="649" text-anchor="middle" class="body">Activities / budgets</text>
  <path d="M460 610H550" class="flow"/>
  <rect x="1040" y="545" width="365" height="130" class="box"/>
  <text x="1222" y="583" text-anchor="middle" class="head">Feature databases x 5</text>
  <text x="1222" y="617" text-anchor="middle" class="body">Database HTTP services</text>
  <text x="1222" y="649" text-anchor="middle" class="small">One SQLite store per feature</text>
  <path d="M915 610H1040" class="flow"/>
  <text x="937" y="593" class="small">Own DB</text>

  <rect x="550" y="378" width="365" height="95" class="box"/>
  <text x="732" y="413" text-anchor="middle" class="head">Shared reference API</text>
  <text x="732" y="445" text-anchor="middle" class="body">Country / city / currency :9100</text>
  <rect x="1040" y="378" width="365" height="95" class="box"/>
  <text x="1222" y="413" text-anchor="middle" class="head">Shared reference database</text>
  <text x="1222" y="445" text-anchor="middle" class="body">SQLite service :9101</text>
  <path d="M915 425H1040" class="flow"/>
  <path d="M732 545V473" class="flow"/>
  <text x="747" y="510" class="small">Reference lookups</text>
  <text x="540" y="716" class="small">Internal HTTP uses service names + ports; internal ingress is not service-level authorization.</text>

  <rect x="60" y="768" width="1375" height="91" rx="10" fill="#fff4e5" stroke="#d7a45e"/>
  <text x="80" y="802" class="head">Operating constraints</text>
  <text x="80" y="835" class="body">Frontends may scale to zero. Backend/database apps: one replica. SQLite is ephemeral; no Azure Files mount.</text>
  <path d="M1250 195V205H1450V304H1225V315" class="delivery"/>
  <path d="M205 195V207H20V425H85" class="flow"/>
  <text x="1225" y="238" text-anchor="middle" class="body">Managed-identity image pulls</text>
  <text x="1225" y="267" text-anchor="middle" class="small">tripgenie-acr-pull / registry-scoped AcrPull</text>

  <rect x="40" y="920" width="1420" height="122" rx="14" fill="#f5f2fb" stroke="#ac9bc3" stroke-dasharray="8 5"/>
  <text x="60" y="958" class="head">Developer host only / excluded from the Azure baseline</text>
  <text x="60" y="994" class="body">Ollama + AI-Mode + MCP + RAG + Multi-Agent Server; agentic-loop reviews also run locally.</text>
  <text x="60" y="1024" class="small">Switched integrations are off; Student 3/5 direct AI calls remain unavailable. Demonstrate ordinary cloud functionality.</text>
  <path d="M50 1090H135" class="flow"/>
  <text x="155" y="1097" class="small">Application / navigation path</text>
  <path d="M550 1090H635" class="delivery"/>
  <text x="655" y="1097" class="small">Image delivery</text>
  <text x="40" y="1143" class="small">Cloud source: 7bcedc9 (PR #189). Public access does not imply application-user authentication.</text>
</svg>
