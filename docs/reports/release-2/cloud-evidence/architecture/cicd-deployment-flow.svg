<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1270" viewBox="0 0 1500 1270" role="img" aria-labelledby="title description">
  <title id="title">TripGenie source-control to Azure deployment pipeline</title>
  <desc id="description">Local security scans precede commits and GitHub Actions validation. The assessment requires two endpoint functions tested per student; dedicated artifacts are missing for Students 2 and 4. Manually dispatched cloud deployment reruns reusable CI, uses the main-only production environment, logs in via OIDC, builds and deploys images, validates them, and publishes review evidence. No required reviewer is configured as of 27 October 2026.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 32px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 650; }
      .body { font-size: 19px; }
      .small { font-size: 18px; }
      .box { stroke: #8ca4bc; stroke-width: 1.6; rx: 12; fill: #fff; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="1270" fill="#fff"/>
  <text x="40" y="48" class="title">CI/CD: source control to Azure</text>
  <text x="40" y="80" class="body">Implemented delivery flow, with incomplete evidence and approval controls marked explicitly</text>

  <rect x="30" y="110" width="1440" height="310" rx="16" fill="#eef5ff" stroke="#87afd7"/>
  <text x="50" y="145" class="head">1  /  LOCAL DEVELOPMENT AND POST-COMMIT VALIDATION</text>
  <rect x="55" y="175" width="270" height="112" class="box"/>
  <text x="190" y="211" text-anchor="middle" class="head">Git source control</text>
  <text x="190" y="243" text-anchor="middle" class="body">Branch + staged changes</text>
  <text x="190" y="271" text-anchor="middle" class="small">Developer attempts commit</text>
  <rect x="380" y="175" width="330" height="112" class="box"/>
  <text x="545" y="211" text-anchor="middle" class="head">Pre-commit security gate</text>
  <text x="545" y="243" text-anchor="middle" class="body">Ruff security / detect-secrets</text>
  <text x="545" y="271" text-anchor="middle" class="body">pip-audit / failure blocks commit</text>
  <rect x="765" y="175" width="290" height="112" class="box"/>
  <text x="910" y="211" text-anchor="middle" class="head">Commit + push / PR</text>
  <text x="910" y="243" text-anchor="middle" class="body">GitHub source repository</text>
  <text x="910" y="271" text-anchor="middle" class="small">Relevant path-filtered CI starts</text>
  <rect x="1110" y="175" width="335" height="112" class="box"/>
  <text x="1277" y="211" text-anchor="middle" class="head">GitHub Actions</text>
  <text x="1277" y="243" text-anchor="middle" class="body">student-1-ci ... student-5-ci</text>
  <text x="1277" y="271" text-anchor="middle" class="small">Shared service validation</text>
  <path d="M325 231H380" class="flow"/>
  <path d="M710 231H765" class="flow"/>
  <path d="M1055 231H1110" class="flow"/>
  <path d="M1277 287V313H1010V330" class="flow"/>
  <rect x="570" y="330" width="875" height="64" class="box"/>
  <text x="1007" y="355" text-anchor="middle" class="body">Post-commit API tests: two endpoint functions per student (required)</text>
  <text x="1007" y="382" text-anchor="middle" class="small">JUnit + Markdown artifacts: S1, S3, S5 present; S2 and S4 missing as at 27 Oct</text>
  <rect x="55" y="330" width="440" height="64" class="box"/>
  <text x="275" y="355" text-anchor="middle" class="body">Docker build / lint / tests / validation</text>
  <text x="275" y="382" text-anchor="middle" class="small">Per-service job ordering varies</text>
  <path d="M570 362H495" class="flow"/>

  <rect x="30" y="450" width="1440" height="454" rx="16" fill="#edf8f3" stroke="#8ebca8"/>
  <text x="50" y="486" class="head">2  /  MANUALLY DISPATCHED CLOUD DEPLOYMENT</text>
  <path d="M275 394V435H15V576H55" class="flow"/>
  <rect x="55" y="520" width="440" height="112" class="box"/>
  <text x="275" y="554" text-anchor="middle" class="head">Select main / dispatch deployment</text>
  <text x="275" y="586" text-anchor="middle" class="body">cloud-deployment.yml</text>
  <text x="275" y="614" text-anchor="middle" class="small">workflow_dispatch; no automatic push deploy</text>
  <rect x="555" y="520" width="410" height="112" class="box"/>
  <text x="760" y="554" text-anchor="middle" class="head">Rerun all reusable CI workflows</text>
  <text x="760" y="586" text-anchor="middle" class="body">Shared + AI-Mode + five students</text>
  <text x="760" y="614" text-anchor="middle" class="small">Failed prerequisite prevents deploy job</text>
  <rect x="1025" y="520" width="420" height="112" rx="12" fill="#fff4e5" stroke="#d7a45e" stroke-width="1.6"/>
  <text x="1235" y="554" text-anchor="middle" class="head">production environment</text>
  <text x="1235" y="586" text-anchor="middle" class="body">Branch policy: main only</text>
  <text x="1235" y="614" text-anchor="middle" class="small">Required reviewer NOT currently configured</text>
  <path d="M495 576H555" class="flow"/>
  <path d="M965 576H1025" class="flow"/>
  <path d="M1235 632V663H275V700" class="flow"/>

  <rect x="55" y="700" width="440" height="112" class="box"/>
  <text x="275" y="734" text-anchor="middle" class="head">Azure login / deployment setup</text>
  <text x="275" y="766" text-anchor="middle" class="body">OIDC federated identity</text>
  <text x="275" y="794" text-anchor="middle" class="small">No stored Azure client password</text>
  <rect x="555" y="700" width="410" height="112" class="box"/>
  <text x="760" y="734" text-anchor="middle" class="head">Build + push to ACR</text>
  <text x="760" y="766" text-anchor="middle" class="body">Linux images / commit-SHA tags</text>
  <text x="760" y="794" text-anchor="middle" class="small">Compose-derived service inventory</text>
  <rect x="1025" y="700" width="420" height="112" class="box"/>
  <text x="1235" y="734" text-anchor="middle" class="head">Deploy to Azure Container Apps</text>
  <text x="1235" y="766" text-anchor="middle" class="body">Cloud profile / managed-identity pulls</text>
  <text x="1235" y="794" text-anchor="middle" class="small">18 apps / AI services excluded</text>
  <path d="M495 756H555" class="flow"/>
  <path d="M965 756H1025" class="flow"/>
  <text x="55" y="865" class="body">Deployment scripts: build-images.sh + compose_to_azure.py + deploy-azure-env.sh + deploy-azure.sh</text>

  <rect x="30" y="934" width="1440" height="244" rx="16" fill="#f5f2fb" stroke="#ac9bc3"/>
  <text x="50" y="970" class="head">3  /  DEPLOYMENT EVIDENCE AND HUMAN RELEASE DECISION</text>
  <path d="M1235 812V920H15V1072H55" class="flow"/>
  <rect x="55" y="1005" width="360" height="135" class="box"/>
  <text x="235" y="1040" text-anchor="middle" class="head">Validate deployed version</text>
  <text x="235" y="1073" text-anchor="middle" class="body">Latest revision + intended image</text>
  <text x="235" y="1103" text-anchor="middle" class="body">Readiness / CRUD / HTTPS</text>
  <text x="235" y="1129" text-anchor="middle" class="small">Ingress / identity / registry checks</text>
  <rect x="475" y="1005" width="465" height="135" class="box"/>
  <text x="707" y="1040" text-anchor="middle" class="head">Publish evidence</text>
  <text x="707" y="1073" text-anchor="middle" class="body">cloud-deployment-evidence artifact</text>
  <text x="707" y="1103" text-anchor="middle" class="body">cloud-deployment-results.md + job summary</text>
  <text x="707" y="1129" text-anchor="middle" class="small">Publication attempted even when validation fails</text>
  <rect x="1000" y="1005" width="445" height="135" class="box"/>
  <text x="1222" y="1040" text-anchor="middle" class="head">Cloud Deployment Review</text>
  <text x="1222" y="1073" text-anchor="middle" class="body">Local agentic-loop analysis</text>
  <text x="1222" y="1103" text-anchor="middle" class="body">Separate human release decision</text>
  <text x="1222" y="1129" text-anchor="middle" class="small">READY / NOT READY / PENDING</text>
  <path d="M415 1072H475" class="flow"/>
  <path d="M940 1072H1000" class="flow"/>
  <text x="40" y="1219" class="small">Evidence snapshot: 27 Oct 2026. A successful CI job does not prove a missing artifact or an unconfigured reviewer rule.</text>
  <text x="40" y="1250" class="small">Selected deployment: run 40476984860, SHA 7bcedc9 (PR #189). Evidence captured 27 Oct 2026.</text>
</svg>
