name: Student 2 CI

on:
  push:
    paths:
      - 'student-2/**'
      # The end-to-end tests drive the real shared reference service, so a
      # change there can break this suite.
      - 'shared/**'
      # The ask box calls the shared AI-Mode service; its contract is what the
      # backend's fake in tests/backend is a copy of.
      - 'ai-services/ai-mode/**'
      # The guide box's corpus and /query contract live with the RAG server.
      - 'ai-services/rag-server/**'
      - 'ruff.toml'
      - 'docker-compose.yml'
      - 'scripts/ci/wait_for_http.py'
      - '.github/workflows/student-2-ci.yml'
  pull_request:
    paths:
      - 'student-2/**'
      # The end-to-end tests drive the real shared reference service, so a
      # change there can break this suite.
      - 'shared/**'
      # The ask box calls the shared AI-Mode service; its contract is what the
      # backend's fake in tests/backend is a copy of.
      - 'ai-services/ai-mode/**'
      # The guide box's corpus and /query contract live with the RAG server.
      - 'ai-services/rag-server/**'
      - 'ruff.toml'
      - 'docker-compose.yml'
      - 'scripts/ci/wait_for_http.py'
      - '.github/workflows/student-2-ci.yml'
  workflow_dispatch:
  # cloud-deployment.yml runs this as a gate before every deploy.
  workflow_call:

jobs:
  services:
    name: Build and Validate Student 2 Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: student-2/pyproject.toml
      - name: Install dependencies
        # shared/ too: tests/e2e wires this service to the real shared
        # reference service, which is what catches drift in the id/name swap.
        run: pip install -e "./shared[dev]" -e "./student-2[dev]"
      - name: Lint
        run: |
          ruff check student-2
          ruff format --check student-2
      - name: Run tests
        # tests/endpoint needs the live stack and runs in the compose job.
        run: pytest student-2/tests/database student-2/tests/backend student-2/tests/frontend student-2/tests/e2e -q
      - name: Build database service image
        run: docker build -f student-2/database/Dockerfile -t student-2-database student-2
      - name: Health check database service
        run: |
          docker run -d --name student-2-database -p 9001:9001 student-2-database
          if ! python scripts/ci/wait_for_http.py \
            --label "student 2 database" \
            http://localhost:9001/health; then
            docker logs student-2-database
            exit 1
          fi
      - name: Build backend service image
        run: docker build -f student-2/backend/Dockerfile -t student-2-backend student-2
      - name: Health check backend service
        # No database container on this network, so /health answers "degraded"
        # with a 200 -- that is the documented behaviour and what is under test
        # here: the service itself starts and serves.
        run: |
          # MCP, RAG and multi-agent stay disabled in CI: AI_MODE_URL (which
          # the MCP assistant rides on) and RAG_URL are empty and
          # MULTI_AGENT_ENABLED is false, so those boxes answer "disabled" and
          # nothing reaches for a host service.
          docker run -d --name student-2-backend -p 9000:9000 \
            -e AI_MODE_URL= -e RAG_URL= -e MULTI_AGENT_ENABLED=false \
            student-2-backend
          if ! python scripts/ci/wait_for_http.py \
            --label "student 2 backend" \
            http://localhost:9000/health; then
            docker logs student-2-backend
            exit 1
          fi
      - name: Check multi-agent is disabled in CI
        run: |
          curl --fail --silent --show-error http://127.0.0.1:9000/health \
            | python -c "import json, sys; h = json.load(sys.stdin); print('multi_agent:', h['multi_agent']); assert h['multi_agent'] == 'disabled'"
          curl --silent --show-error -X POST -H 'Content-Type: application/json' \
            -d '{"question": "A cheap stay in Sydney"}' \
            http://127.0.0.1:9000/accommodation/agent-runs \
            | python -c "import json, sys; d = json.load(sys.stdin)['detail']; print('agent-run route:', d); assert d.startswith('MULTI_AGENT_DISABLED')"
      - name: Build frontend service image
        run: docker build -f student-2/frontend/Dockerfile -t student-2-frontend student-2
      - name: Health check frontend service
        # Same as the backend above: no backend container on this network, so
        # /health answers "degraded" with a 200. What is under test is that the
        # service starts and serves.
        run: |
          docker run -d --name student-2-frontend -p 9003:9003 student-2-frontend
          if ! python scripts/ci/wait_for_http.py \
            --label "student 2 frontend" \
            http://localhost:9003/health; then
            docker logs student-2-frontend
            exit 1
          fi

  compose:
    name: Student 2 Post-Commit Endpoint Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the Student 2 slice
        # MCP, RAG and multi-agent stay off: no host service exists in CI.
        env:
          STUDENT2_BACKEND_AI_MODE_URL: ""
          STUDENT2_BACKEND_RAG_URL: ""
          STUDENT2_BACKEND_MULTI_AGENT_ENABLED: "false"
        run: |
          docker compose up -d --build --no-deps \
            shared-database shared-backend \
            student-2-database student-2-backend
      - name: Wait for the backend
        run: python scripts/ci/wait_for_http.py --label "student 2 backend" http://127.0.0.1:9000/health
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 2 endpoint test dependencies
        working-directory: student-2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      # POST /accommodation and GET /accommodation/{id} over HTTP against the
      # stack started above; the backend is published on 9000.
      - name: Post-commit endpoint tests
        working-directory: student-2
        env:
          STUDENT2_ENDPOINT_BASE_URL: http://127.0.0.1:9000
        run: python -m pytest tests/endpoint --junitxml=student-2-endpoint-tests.xml -v
      - name: Endpoint test summary
        if: always()
        working-directory: student-2
        run: |
          python - <<'EOF' | tee student-2-endpoint-tests.md >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          print("## Student 2 post-commit endpoint tests\n")
          if not os.path.exists("student-2-endpoint-tests.xml"):
              print("The endpoint tests did not run.")
              raise SystemExit
          print("| Test | Result |\n| --- | --- |")
          for case in ET.parse("student-2-endpoint-tests.xml").iter("testcase"):
              outcome = next(
                  (child.tag for child in case if child.tag in {"failure", "error", "skipped"}),
                  "passed",
              )
              mark = "PASS" if outcome == "passed" else outcome.upper()
              print(f"| `{case.get('name')}` | {mark} |")
          EOF
      - name: Upload endpoint test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-2-endpoint-test-evidence
          path: |
            student-2/student-2-endpoint-tests.xml
            student-2/student-2-endpoint-tests.md
      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color \
            shared-backend student-2-database student-2-backend
